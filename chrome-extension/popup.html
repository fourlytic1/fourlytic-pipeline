<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fourlytic Gmail Sync</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; width: 260px; margin: 0; padding: 16px; background: #fff; color: #1a1f24; }
  h1 { font-size: 14px; font-weight: 700; margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
  label { font-size: 12px; font-weight: 600; color: #566; display: block; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #d7dde3; border-radius: 7px; font-size: 13px; }
  button { width: 100%; margin-top: 14px; padding: 9px; border: none; border-radius: 7px; background: #ea580c; color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: #dc2626; font-size: 12px; margin-top: 8px; display: none; }
  .err.show { display: block; }
  .signed-in { text-align: center; }
  .signed-in .name { font-weight: 700; margin: 6px 0 2px; }
  .signed-in .sub { font-size: 12px; color: #667; margin-bottom: 14px; }
  .ghost { background: transparent; color: #566; border: 1px solid #d7dde3; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>Fourlytic Gmail Sync</h1>

  <div id="loginView">
    <label>Username</label>
    <input id="username" autocomplete="username">
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button id="loginBtn">Sign in</button>
  </div>

  <div id="signedInView" class="signed-in hidden">
    <div class="name" id="displayName"></div>
    <div class="sub">Connected — open an email in Gmail to sync it.</div>
    <button class="ghost" id="logoutBtn">Sign out</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
