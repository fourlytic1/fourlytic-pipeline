<style>
:root{
  --bg:#F7F7FB; --surface:#FFFFFF; --surface-2:#F1F1F8;
  --border:#E4E4F0; --fg:#15162B; --fg-muted:#5B5D78; --fg-faint:#9394AC;
  --accent:#5B4FE8; --accent-2:#00B8A9; --accent-fg:#FFFFFF; --accent-soft:#EEEBFC;
  --accent-grad: linear-gradient(135deg, var(--accent), var(--accent-2));
  --btn-grad: linear-gradient(120deg, #FF8A50, #E04A1E);
  --good:#16A364; --good-soft:#E1F7EC;
  --bad:#E5484D; --bad-soft:#FDE8E8;
  --warn:#F5A524; --warn-soft:#FEF3DD;
  --info:#3E7BFA; --info-soft:#E8F0FE;
  --shadow: 0 1px 2px rgba(21,22,43,.05), 0 8px 22px rgba(91,79,232,.08);
  --font-display:'Space Grotesk', 'Segoe UI', sans-serif;
  --font-body:'Inter', 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E1A; --surface:#16172A; --surface-2:#1D1E36;
    --border:#2A2B48; --fg:#F1F1FA; --fg-muted:#A3A4C2; --fg-faint:#6C6D8C;
    --accent:#8C7FFF; --accent-2:#2DD4C4; --accent-fg:#0E0E1A; --accent-soft:#241F4A;
    --btn-grad: linear-gradient(120deg, #FF9D66, #F2582E);
    --good:#3DD68C; --good-soft:#113524;
    --bad:#FF6369; --bad-soft:#3A1620;
    --warn:#FFC256; --warn-soft:#3A2A10;
    --info:#6EA8FF; --info-soft:#182540;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E1A; --surface:#16172A; --surface-2:#1D1E36;
  --border:#2A2B48; --fg:#F1F1FA; --fg-muted:#A3A4C2; --fg-faint:#6C6D8C;
  --accent:#8C7FFF; --accent-2:#2DD4C4; --accent-fg:#0E0E1A; --accent-soft:#241F4A;
  --btn-grad: linear-gradient(120deg, #FF9D66, #F2582E);
  --good:#3DD68C; --good-soft:#113524;
  --bad:#FF6369; --bad-soft:#3A1620;
  --warn:#FFC256; --warn-soft:#3A2A10;
  --info:#6EA8FF; --info-soft:#182540;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.45);
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#F7F7FB; --surface:#FFFFFF; --surface-2:#F1F1F8;
  --border:#E4E4F0; --fg:#15162B; --fg-muted:#5B5D78; --fg-faint:#9394AC;
  --accent:#5B4FE8; --accent-2:#00B8A9; --accent-fg:#FFFFFF; --accent-soft:#EEEBFC;
  --btn-grad: linear-gradient(120deg, #FF8A50, #E04A1E);
  --good:#16A364; --good-soft:#E1F7EC;
  --bad:#E5484D; --bad-soft:#FDE8E8;
  --warn:#F5A524; --warn-soft:#FEF3DD;
  --info:#3E7BFA; --info-soft:#E8F0FE;
  --shadow: 0 1px 2px rgba(21,22,43,.05), 0 8px 22px rgba(91,79,232,.08);
  color-scheme: light;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--font-body); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0; text-wrap:balance;}
a{color:var(--accent);}
button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
.tabular{font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{height:10px; width:10px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}

#app{height:100%;}
.shell{display:flex; height:100%;}
.sidebar{width:220px; flex:none; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:18px 0;}
.brand{display:flex; align-items:center; gap:10px; padding:0 18px 18px; border-bottom:1px solid var(--border); margin-bottom:10px;}
.brand .mark{width:32px; height:32px; display:flex; align-items:center; justify-content:center; flex:none;}
.brand .mark img{width:100%; height:100%; object-fit:contain; display:block;}
.brand .name{font-family:var(--font-display); font-weight:700; font-size:15px;}
.nav{display:flex; flex-direction:column; gap:2px; padding:0 10px;}
.nav button{all:unset; cursor:pointer; padding:9px 12px; border-radius:8px; color:var(--fg-muted); display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:500;}
.nav button svg{flex:none; opacity:.8;}
.nav button:hover{background:var(--surface-2); color:var(--fg);}
.nav button.active{background:var(--accent-soft); color:var(--accent);}
.nav .section-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--fg-faint); padding:14px 12px 6px;}
.sidebar-footer{margin-top:auto; padding:12px 18px 4px; border-top:1px solid var(--border);}
.me{display:flex; align-items:center; gap:9px;}
.me .avatar{width:30px; height:30px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex:none;}
.me .who{min-width:0;}
.me .who .n{font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.me .who .r{font-size:11px; color:var(--fg-faint); text-transform:uppercase; letter-spacing:.04em;}
.logout-btn{all:unset; cursor:pointer; font-size:12px; color:var(--fg-faint); display:block;}
.logout-btn:hover{color:var(--bad);}
.footer-row{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
.theme-toggle{all:unset; cursor:pointer; width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--fg-muted); border:1px solid var(--border); background:var(--surface); flex:none;}
.theme-toggle:hover{background:var(--surface-2); color:var(--fg);}
.login-theme-toggle{position:absolute; top:18px; right:18px;}

.main{flex:1; min-width:0; overflow:auto; padding:22px 26px 60px;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
.topbar h1{font-size:21px;}
.topbar .sub{color:var(--fg-muted); font-size:13px; margin-top:2px;}
.search{position:relative; width:260px; max-width:60vw;}
.search input{width:100%; padding:8px 12px 8px 32px; border-radius:8px; border:1px solid var(--border); background:var(--surface); outline:none;}
.search input:focus{border-color:var(--accent);}
.search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--fg-faint);}

.btn{all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:8px; font-weight:600; font-size:13px; border:1px solid transparent; transition:filter .15s ease, box-shadow .15s ease, transform .1s ease;}
.btn-primary{background:var(--btn-grad); background-size:160% 160%; color:#FFFFFF; box-shadow:0 3px 12px rgba(189,85,48,.3);}
.btn-primary:hover{filter:brightness(1.07); box-shadow:0 5px 18px rgba(189,85,48,.4);}
.btn-primary:active{transform:translateY(1px); filter:brightness(0.97);}
.btn-ghost{background:var(--surface); border-color:var(--border); color:var(--fg);}
.btn-ghost:hover{background:var(--surface-2);}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-sm{padding:5px 10px; font-size:12px;}

.login-wrap{min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px;}
.login-card{position:relative; width:100%; max-width:360px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px 28px; box-shadow:var(--shadow);}
.login-card .mark{width:64px; height:64px; display:flex; align-items:center; justify-content:center; margin-bottom:16px;}
.login-card .mark img{width:100%; height:100%; object-fit:contain; display:block;}
.login-card h1{font-size:19px; margin-bottom:4px;}
.login-card p.lead{color:var(--fg-muted); font-size:13px; margin-bottom:22px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--fg-muted); margin-bottom:6px;}
.field input{width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); outline:none;}
.field input:focus{border-color:var(--accent); background:var(--surface);}
.login-err{background:var(--bad-soft); color:var(--bad); font-size:12.5px; padding:9px 11px; border-radius:8px; margin-bottom:14px; display:none;}
.login-err.show{display:block;}
.login-card .btn-primary{display:table; width:auto; min-width:160px; margin:4px auto 0; padding:11px 28px; text-align:center;}
.login-hint{margin-top:18px; font-size:11.5px; color:var(--fg-faint); line-height:1.5;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:12px;}
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:20px;}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px;}
.stat .num{font-family:var(--font-display); font-size:24px; font-weight:700;}
.stat .lbl{font-size:12px; color:var(--fg-muted); margin-top:2px;}

table{width:100%; border-collapse:collapse;}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--surface);}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--fg-faint); font-weight:600; padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:11px 14px; border-bottom:1px solid var(--border); font-size:13.5px; white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr.row-click{cursor:pointer;}
tr.row-click:hover{background:var(--surface-2);}
.name-cell{font-weight:600;}
.muted{color:var(--fg-muted);}
.faint{color:var(--fg-faint);}
.empty-state{padding:50px 20px; text-align:center; color:var(--fg-muted);}
.empty-state .big{font-size:32px; margin-bottom:10px;}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:100px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap;}
.badge-admin{background:var(--accent-soft); color:var(--accent);}
.badge-sales{background:var(--info-soft); color:var(--info);}
.pill{display:inline-flex; align-items:center; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:100px; white-space:nowrap;}

.board{display:flex; gap:14px; overflow-x:auto; padding-bottom:14px; align-items:flex-start;}
.col{flex:none; width:250px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; display:flex; flex-direction:column; max-height:calc(100vh - 160px);}
.col-head{padding:12px 13px 10px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
.col-head .t{font-weight:700; font-size:12.5px; display:flex; align-items:center; gap:7px;}
.col-head .dot{width:8px; height:8px; border-radius:50%; flex:none;}
.col-head .count{font-size:11px; color:var(--fg-faint); background:var(--surface); border:1px solid var(--border); border-radius:100px; padding:1px 7px;}
.col-body{overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:9px; transition:background-color .12s, outline-color .12s; outline:2px dashed transparent; outline-offset:-2px;}
.col-body.drag-over{background:var(--accent-soft); outline-color:var(--accent);}
.deal-card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 12px; cursor:grab; transition:border-color .12s, opacity .12s;}
.deal-card:hover{border-color:var(--accent);}
.deal-card.dragging{opacity:.45; cursor:grabbing;}
.deal-card .dn{font-weight:700; font-size:13px; margin-bottom:3px;}
.deal-card .dc{font-size:12px; color:var(--fg-muted); margin-bottom:7px;}
.deal-card .meta{display:flex; align-items:center; justify-content:space-between; gap:6px;}
.deal-card .rate{font-size:12px; font-weight:600; color:var(--accent);}
.deal-card .owner{width:20px; height:20px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center;}
.col-empty{padding:18px 8px; text-align:center; color:var(--fg-faint); font-size:12px;}

.overlay{position:fixed; inset:0; background:rgba(10,14,18,.45); z-index:40; display:flex; justify-content:flex-end;}
.drawer{width:min(560px, 100vw); height:100%; background:var(--surface); box-shadow:var(--shadow); overflow-y:auto; animation:slidein .18s ease-out;}
@keyframes slidein{from{transform:translateX(24px); opacity:0;} to{transform:translateX(0); opacity:1;}}
.drawer-head{position:sticky; top:0; background:var(--surface); border-bottom:1px solid var(--border); padding:16px 20px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; z-index:2;}
.drawer-head h2{font-size:18px;}
.drawer-head .sub{font-size:12.5px; color:var(--fg-muted); margin-top:3px;}
.icon-btn{all:unset; cursor:pointer; width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:var(--fg-muted);}
.icon-btn:hover{background:var(--surface-2); color:var(--fg);}
.drawer-body{padding:16px 20px 40px;}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px; overflow-x:auto;}
.tab{all:unset; cursor:pointer; padding:9px 12px; font-size:12.5px; font-weight:600; color:var(--fg-muted); border-bottom:2px solid transparent; white-space:nowrap;}
.tab.active{color:var(--accent); border-bottom-color:var(--accent);}
.kv{display:grid; grid-template-columns:120px 1fr; gap:9px 12px; font-size:13px;}
.kv .k{color:var(--fg-faint); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; padding-top:2px;}
.kv .v{min-width:0; word-break:break-word;}
.kv .v a{word-break:break-all;}
.section-title{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--fg-faint); margin:22px 0 10px;}
.section-title:first-child{margin-top:0;}

.act-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
.act-item:last-child{border-bottom:none;}
.act-item .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); margin-top:6px; flex:none;}
.act-item .body{min-width:0;}
.act-item .txt{font-size:13px;}
.act-item .meta{font-size:11px; color:var(--fg-faint); margin-top:2px;}
.task-item{display:flex; align-items:flex-start; gap:9px; padding:9px 0; border-bottom:1px solid var(--border);}
.task-item:last-child{border-bottom:none;}
.task-item input[type=checkbox]{margin-top:2px; width:16px; height:16px; accent-color:var(--accent);}
.task-item.done .tt{text-decoration:line-through; color:var(--fg-faint);}
.task-item .tt{font-size:13px; font-weight:500;}
.task-item .tm{font-size:11px; color:var(--fg-faint); margin-top:2px;}

textarea.note-input{width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 11px; background:var(--surface-2); resize:vertical; min-height:60px; outline:none;}
textarea.note-input:focus{border-color:var(--accent); background:var(--surface);}
.inline-form{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
.inline-form input, .inline-form select{flex:1; min-width:120px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2);}

.modal-overlay{position:fixed; inset:0; background:rgba(10,14,18,.45); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal{width:100%; max-width:480px; max-height:90vh; overflow-y:auto; background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:22px;}
.modal h3{font-size:16px; margin-bottom:16px;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.form-grid .full{grid-column:1/-1;}
.form-grid label{display:block; font-size:11.5px; font-weight:600; color:var(--fg-muted); margin-bottom:5px;}
.form-grid input, .form-grid select, .form-grid textarea{width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); outline:none;}
.form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus{border-color:var(--accent); background:var(--surface);}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

.toast-wrap{position:fixed; bottom:18px; right:18px; z-index:60; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:9px; font-size:13px; box-shadow:var(--shadow); animation:toastin .15s ease-out;}
.toast.err{background:var(--bad);}
@keyframes toastin{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.user-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);}
.user-row:last-child{border-bottom:none;}
.user-row .avatar{width:34px; height:34px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none;}
.user-row .info{flex:1; min-width:0;}
.user-row .info .n{font-weight:600; font-size:13.5px;}
.user-row .info .u{font-size:12px; color:var(--fg-faint);}

@media (max-width: 760px){
  .sidebar{position:fixed; z-index:30; height:100%; transform:translateX(-100%); transition:transform .18s;}
  .sidebar.open{transform:translateX(0);}
  .menu-btn{display:flex !important;}
  .form-grid{grid-template-columns:1fr;}
}
.menu-btn{display:none; all:unset; cursor:pointer; width:34px; height:34px; align-items:center; justify-content:center; border-radius:8px; border:1px solid var(--border); background:var(--surface); margin-right:8px;}
.sidebar-backdrop{display:none;}
@media (max-width: 760px){
  .sidebar-backdrop{display:block; position:fixed; inset:0; background:rgba(10,14,18,.4); z-index:29;}
}
</style>
</head>

/* ---------------- theme ---------------- */
function getStoredTheme(){ try{ return localStorage.getItem('fourlytic-theme'); }catch(e){ return null; } }
function isDarkActive(){
  const s = getStoredTheme();
  if (s==='dark') return true;
  if (s==='light') return false;
  try{ return window.matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return false; }
}
function applyStoredTheme(){
  const s = getStoredTheme();
  if (s==='dark' || s==='light') document.documentElement.setAttribute('data-theme', s);
  else document.documentElement.removeAttribute('data-theme');
}
function toggleTheme(){
  const next = isDarkActive() ? 'light' : 'dark';
  try{ localStorage.setItem('fourlytic-theme', next); }catch(e){}
  applyStoredTheme();
  render();
}
function themeIconSvg(dark){
  return dark
    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>'
    : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>';
}
applyStoredTheme();

/* ---------------- utils ---------------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeHref(url){
  if (!url) return '';
  const u = String(url).trim();
  if (/^(https?:|mailto:|tel:)/i.test(u)) return u;
  return 'https://' + u;
}
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function fmtDate(d){ if(!d) return '—'; try{ return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}catch(e){return d;} }
function fmtDateTime(d){ if(!d) return '—'; try{ return new Date(d).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return d;} }
function toast(msg, isErr){
  const wrap = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast' + (isErr?' err':'');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}
function stageMeta(id){ return STAGES.find(s=>s.id===id) || STAGES[0]; }
function userById(id){ return state.users.find(u=>u.id===id); }
function companyById(id){ return state.companies.find(c=>c.id===id); }
function contactById(id){ return state.contacts.find(c=>c.id===id); }
function dealById(id){ return state.deals.find(d=>d.id===id); }
function contactName(c){ return c ? `${c.first_name||''} ${c.last_name||''}`.trim() || '(unnamed)' : '—'; }
function isAdmin(){ return state.me && state.me.role === 'admin'; }

/* ---------------- boot ---------------- */
async function boot(){
  render();
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    await loadMyProfile();
  }
  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN') {
      await loadMyProfile();
    } else if (event === 'SIGNED_OUT') {
      state.authed = false; state.me = null; render();
    }
  });
}
boot();

async function loadMyProfile(){
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (error || !profile || !profile.active) {
    toast('Your account is not active. Contact an admin.', true);
    await sb.auth.signOut();
    return;
  }
  state.me = { id: profile.id, username: profile.username, displayName: profile.display_name, role: profile.role };
  state.authed = true;
  render();
  subscribeAll();
}

/* ---------------- data loading + realtime ---------------- */
let subscribed = false;
async function subscribeAll(){
  if (subscribed) return;
  subscribed = true;
  const tables = [
    ['users','profiles'], ['companies','companies'], ['contacts','contacts'],
    ['deals','deals'], ['activities','activities'], ['tasks','tasks']
  ];
  for (const [key, table] of tables) {
    await reload(key, table);
    sb.channel(table + '-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table }, () => reload(key, table))
      .subscribe();
  }
}
const TYPING_PROTECTED_IDS = ['activityInput','taskTitle','taskDue'];
async function reload(key, table){
  const { data, error } = await sb.from(table).select('*');
  if (error) { console.error(table, error); toast('Could not load '+table, true); return; }
  state[key] = data || [];
  state.loaded[key] = true;
  // Don't blow away an in-progress note/task the user is typing in the
  // open drawer just because an unrelated record changed elsewhere.
  const active = document.activeElement;
  if (active && TYPING_PROTECTED_IDS.includes(active.id)) return;
  render();
}

/* ---------------- auth ---------------- */
async function tryLogin(username, password){
  const genericErr = 'Invalid username or password.';
  const { data: email, error: lookupErr } = await sb.rpc('email_for_username', { p_username: username.trim() });
  if (lookupErr || !email) return { ok:false, msg:genericErr };
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) return { ok:false, msg:genericErr };
  return { ok:true };
}
async function logout(){
  await sb.auth.signOut();
  try{ await sb.removeAllChannels(); }catch(e){}
  subscribed = false;
  state.authed = false; state.me = null;
  state.route='pipeline'; state.detail=null; state.search='';
  state.users=[]; state.companies=[]; state.contacts=[]; state.deals=[]; state.activities=[]; state.tasks=[];
  state.loaded = {users:false, companies:false, contacts:false, deals:false, activities:false, tasks:false};
  render();
}

/* ---------------- writes ---------------- */
async function addActivity(parentType, parentId, kind, text){
  if (!text || !text.trim()) return false;
  const { error } = await sb.from('activities').insert({
    parent_type: parentType, parent_id: parentId, kind, text: text.trim(), by: state.me.displayName
  });
  if (error) { toast(error.message, true); return false; }
  return true;
}
async function addTask(parentType, parentId, title, dueDate){
  if (!title || !title.trim()) return false;
  const { error } = await sb.from('tasks').insert({
    parent_type: parentType, parent_id: parentId, title: title.trim(), due_date: dueDate||null,
    done:false, assigned_to: state.me.displayName, created_by: state.me.displayName
  });
  if (error) { toast(error.message, true); return false; }
  return true;
}
async function toggleTask(task){
  const { error } = await sb.from('tasks').update({ done: !task.done }).eq('id', task.id);
  if (error) toast(error.message, true);
}
async function saveCompany(data, id){
  const payload = {...data};
  if (id){ payload.updated_at = new Date().toISOString(); const { error } = await sb.from('companies').update(payload).eq('id', id); if(error) throw error; return id; }
  payload.created_by = state.me.displayName;
  const { data: row, error } = await sb.from('companies').insert(payload).select().single();
  if (error) throw error;
  return row.id;
}
async function saveContact(data, id){
  const payload = {...data};
  if (id){ payload.updated_at = new Date().toISOString(); const { error } = await sb.from('contacts').update(payload).eq('id', id); if(error) throw error; return id; }
  payload.created_by = state.me.displayName;
  const { data: row, error } = await sb.from('contacts').insert(payload).select().single();
  if (error) throw error;
  return row.id;
}
async function saveDeal(data, id){
  const payload = {...data};
  if (id){ payload.updated_at = new Date().toISOString(); const { error } = await sb.from('deals').update(payload).eq('id', id); if(error) throw error; return id; }
  payload.created_by = state.me.displayName; payload.updated_at = new Date().toISOString();
  const { data: row, error } = await sb.from('deals').insert(payload).select().single();
  if (error) throw error;
  return row.id;
}
async function setDealStage(deal, newStage, dropReason){
  const prevStage = deal.stage;
  const prevReason = deal.position_drop_reason;
  // Optimistic update: move the card instantly instead of waiting on the
  // network round-trip, then revert if the save actually fails.
  deal.stage = newStage;
  if (dropReason) deal.position_drop_reason = dropReason;
  render();
  const payload = { stage:newStage, updated_at:new Date().toISOString() };
  if (dropReason) payload.position_drop_reason = dropReason;
  const { error } = await sb.from('deals').update(payload).eq('id', deal.id);
  if (error) {
    deal.stage = prevStage;
    deal.position_drop_reason = prevReason;
    render();
    toast(error.message, true);
    return;
  }
  await addActivity('deal', deal.id, 'stage-change', `Stage changed to "${stageMeta(newStage).label}"`);
}
async function callManageUser(body){
  const { data, error } = await sb.functions.invoke('manage-user', { body });
  if (error) {
    let msg = error.message;
    try { const ctx = await error.context.json(); if (ctx.error) msg = ctx.error; } catch(e){}
    throw new Error(msg);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}

/* ---------------- render root ---------------- */
function rerenderMain(renderFn, bindFn){
  const main = document.getElementById('main');
  if (!main) return;
  const active = document.activeElement;
  let restoreId = null, selStart = null, selEnd = null;
  if (active && active.id && main.contains(active)){
    restoreId = active.id;
    if (typeof active.selectionStart === 'number'){ selStart = active.selectionStart; selEnd = active.selectionEnd; }
  }
  main.innerHTML = renderFn();
  bindFn();
  if (restoreId){
    const el = document.getElementById(restoreId);
    if (el){ el.focus(); if (selStart !== null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} } }
  }
}

function renderPipelinePage(){
  const loading = !state.loaded.deals || !state.loaded.contacts || !state.loaded.companies;
  const counts = {}; STAGES.forEach(s=>counts[s.id]=0);
  state.deals.forEach(d=>{ if(counts[d.stage]!==undefined) counts[d.stage]++; });
  const total = state.deals.length;
  const wonVal = state.deals.filter(d=>d.stage==='won').length;
  const lostVal = state.deals.filter(d=>d.stage==='lost').length;
  const active = total - wonVal - lostVal;
  return `
    ${topbar('Pipeline', `${total} deal${total!==1?'s':''} total · ${active} active`, `
      <div class="search">${ICONS.search}<input id="pipelineSearch" placeholder="Search deals…" value="${esc(state.search)}"></div>
      <button class="btn btn-primary" id="newDealBtn">${ICONS.plus}New Deal</button>
    `)}
    ${loading ? `<div class="empty-state"><div class="big">⏳</div>Loading pipeline…</div>` : `
    <div class="board">${STAGES.map(st=>renderColumn(st, counts[st.id])).join('')}</div>`}
  `;
}
function renderColumn(st, count){
  const q = state.search.trim().toLowerCase();
  let deals = state.deals.filter(d=>d.stage===st.id);
  if (q){
    deals = deals.filter(d=>{
      const c = contactById(d.contact_id); const co = companyById(d.company_id);
      const hay = [d.deal_name, c?contactName(c):'', co?co.name:''].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  return `
  <div class="col">
    <div class="col-head"><div class="t"><span class="dot" style="background:${st.color}"></span>${st.label}</div><span class="count">${count}</span></div>
    <div class="col-body" data-stage="${st.id}">${deals.length===0 ? `<div class="col-empty">No deals</div>` : deals.map(d=>renderDealCard(d)).join('')}</div>
  </div>`;
}
function renderDealCard(d){
  const c = contactById(d.contact_id);
  const co = companyById(d.company_id);
  const owner = c ? c.lead_owner : null;
  return `
  <div class="deal-card" data-deal="${d.id}" draggable="true">
    <div class="dn">${esc(d.deal_name||'Untitled deal')}</div>
    <div class="dc">${esc(co?co.name:'—')}${c?' · '+esc(contactName(c)):''}</div>
    <div class="meta">
      <span class="rate tabular">${d.rate?('$'+d.rate+(d.rate_type==='Hourly'?'/hr':'/yr')):'—'}</span>
      ${owner?`<span class="owner" title="${esc(owner)}">${initials(owner)}</span>`:''}
    </div>
  </div>`;
}
function bindPipelinePage(){
  const s = document.getElementById('pipelineSearch');
  if (s) s.addEventListener('input', ()=>{ state.search = s.value; rerenderMain(renderPipelinePage, bindPipelinePage); });
  document.querySelectorAll('.deal-card').forEach(el=>{
    el.addEventListener('click', ()=> navigate(state.route, {type:'deal', id:el.dataset.deal}));
    el.addEventListener('dragstart', (e)=>{
      e.dataTransfer.setData('text/plain', el.dataset.deal);
      e.dataTransfer.effectAllowed = 'move';
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', ()=> el.classList.remove('dragging'));
  });
  document.querySelectorAll('.col-body').forEach(col=>{
    col.addEventListener('dragover', (e)=>{ e.preventDefault(); e.dataTransfer.dropEffect = 'move'; col.classList.add('drag-over'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('drag-over'));
    col.addEventListener('drop', async (e)=>{
      e.preventDefault();
      col.classList.remove('drag-over');
      const dealId = e.dataTransfer.getData('text/plain');
      const deal = dealById(dealId);
      const newStage = col.dataset.stage;
      if (!deal || !newStage || deal.stage === newStage) return;
      let reason;
      if (newStage === 'lost' && !deal.position_drop_reason){
        reason = window.prompt('Reason this deal is being marked Lost (optional):', '') || '';
      }
      await setDealStage(deal, newStage, reason);
      toast('Stage updated');
    });
  });
  const nb = document.getElementById('newDealBtn');
  if (nb) nb.addEventListener('click', ()=> openDealModal());
}

/* ---------------- TASKS PAGE ---------------- */
let taskStatusFilter = 'open'; // 'open' | 'done' | 'all'
let taskAssigneeFilter = '';   // '' = everyone
function parentLabel(type, id){
  if (type==='contact'){ const c = contactById(id); return c ? contactName(c) : '(deleted contact)'; }
  if (type==='company'){ const c = companyById(id); return c ? c.name : '(deleted company)'; }
  if (type==='deal'){ const d = dealById(id); return d ? d.deal_name : '(deleted deal)'; }
  return '—';
}
function isOverdue(t){
  if (!t.due_date || t.done) return false;
  return new Date(t.due_date) < new Date(new Date().toDateString());
}
function renderTasksPage(){
  const loading = !state.loaded.tasks;
  const q = state.search.trim().toLowerCase();
  const assignees = Array.from(new Set(state.tasks.map(t=>t.assigned_to).filter(Boolean))).sort();
  let list = state.tasks.slice();
  if (taskStatusFilter==='open') list = list.filter(t=>!t.done);
  else if (taskStatusFilter==='done') list = list.filter(t=>t.done);
  if (taskAssigneeFilter) list = list.filter(t=>t.assigned_to===taskAssigneeFilter);
  if (q) list = list.filter(t=> (t.title+' '+(t.assigned_to||'')+' '+parentLabel(t.parent_type,t.parent_id)).toLowerCase().includes(q));
  list.sort((a,b)=>{
    if (a.done !== b.done) return (a.done?1:0) - (b.done?1:0);
    const ad = a.due_date ? new Date(a.due_date).getTime() : Infinity;
    const bd = b.due_date ? new Date(b.due_date).getTime() : Infinity;
    return ad - bd;
  });
  const openCount = state.tasks.filter(t=>!t.done).length;
  const overdueCount = state.tasks.filter(isOverdue).length;
  return `
    ${topbar('Tasks', `${openCount} open${overdueCount?` · ${overdueCount} overdue`:''}`, `
      <div class="search">${ICONS.search}<input id="tasksSearch" placeholder="Search tasks…" value="${esc(state.search)}"></div>
      <select id="taskStatusSelect">
        <option value="open" ${taskStatusFilter==='open'?'selected':''}>Open</option>
        <option value="done" ${taskStatusFilter==='done'?'selected':''}>Done</option>
        <option value="all" ${taskStatusFilter==='all'?'selected':''}>All</option>
      </select>
      <select id="taskAssigneeSelect">
        <option value="">Everyone</option>
        ${assignees.map(a=>`<option value="${esc(a)}" ${taskAssigneeFilter===a?'selected':''}>${esc(a)}</option>`).join('')}
      </select>
    `)}
    ${loading ? `<div class="empty-state"><div class="big">⏳</div>Loading tasks…</div>` :
      list.length===0 ? `<div class="table-wrap"><div class="empty-state"><div class="big">✅</div>No tasks match.</div></div>` :
      `<div class="table-wrap"><table>
        <thead><tr><th></th><th>Task</th><th>Due</th><th>Assigned to</th><th>Related to</th></tr></thead>
        <tbody>
          ${list.map(t=>{
            const overdue = isOverdue(t);
            return `<tr class="row-click" data-task-row="${t.parent_type}:${t.parent_id}">
              <td><input type="checkbox" data-task="${t.id}" ${t.done?'checked':''}></td>
              <td class="${t.done?'muted':''}" style="${t.done?'text-decoration:line-through;':''}">${esc(t.title)}</td>
              <td ${overdue?'style="color:var(--bad); font-weight:600;"':'class="muted"'}>${t.due_date?fmtDate(t.due_date):'—'}</td>
              <td class="muted">${esc(t.assigned_to)||'—'}</td>
              <td><span class="pill" style="background:var(--surface-2);">${esc(parentLabel(t.parent_type,t.parent_id))}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>`}
  `;
}
function bindTasksPage(){
  const s = document.getElementById('tasksSearch');
  if (s) s.addEventListener('input', ()=>{ state.search = s.value; rerenderMain(renderTasksPage, bindTasksPage); });
  const statusSel = document.getElementById('taskStatusSelect');
  if (statusSel) statusSel.addEventListener('change', ()=>{ taskStatusFilter = statusSel.value; rerenderMain(renderTasksPage, bindTasksPage); });
  const assigneeSel = document.getElementById('taskAssigneeSelect');
  if (assigneeSel) assigneeSel.addEventListener('change', ()=>{ taskAssigneeFilter = assigneeSel.value; rerenderMain(renderTasksPage, bindTasksPage); });
  document.querySelectorAll('[data-task]').forEach(cb=> cb.addEventListener('click', e=> e.stopPropagation()));
  document.querySelectorAll('[data-task]').forEach(cb=> cb.addEventListener('change', async ()=>{ await toggleTask(state.tasks.find(t=>t.id===cb.dataset.task)); }));
  document.querySelectorAll('tr[data-task-row]').forEach(el=> el.addEventListener('click', ()=>{
    const [type, id] = el.dataset.taskRow.split(':');
    navigate(state.route, {type, id});

}

/* ---------------- DETAIL DRAWER ---------------- */
let drawerTab = 'overview';
function renderDetailDrawer(){
  const {type, id} = state.detail;
  let obj, title, sub;
  if (type==='contact'){ obj = contactById(id); title = obj?contactName(obj):'Contact'; sub = obj&&companyById(obj.company_id)?companyById(obj.company_id).name:''; }
  else if (type==='company'){ obj = companyById(id); title = obj?obj.name:'Company'; sub = obj?.location||''; }
  else if (type==='deal'){ obj = dealById(id); title = obj?obj.deal_name:'Deal'; sub = obj?stageMeta(obj.stage).label:''; }
  if (!obj){
    return `<div class="overlay" id="drawerOverlay"><div class="drawer"><div class="drawer-head"><div><h2>Not found</h2></div><button class="icon-btn" id="closeDrawer">${ICONS.close}</button></div></div></div>`;
  }
  return `
  <div class="overlay" id="drawerOverlay">
    <div class="drawer">
      <div class="drawer-head">
        <div><h2>${esc(title)}</h2><div class="sub">${esc(sub)}</div></div>
        <div style="display:flex; gap:6px;">
          <button class="icon-btn" id="editDetailBtn" title="Edit">✎</button>
          <button class="icon-btn" id="closeDrawer">${ICONS.close}</button>
        </div>
      </div>
      <div class="drawer-body">${renderDetailTabs(type)}<div id="tabContent">${renderDetailTabContent(type, obj)}</div></div>
    </div>
  </div>`;
}
function renderDetailTabs(type){
  const tabs = type==='deal'
    ? [['overview','Overview'],['activity','Activity'],['tasks','Tasks']]
    : [['overview','Overview'],['notes','Notes'],['activity','Activity'],['tasks','Tasks'],['deals','Deals']];
  return `<div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${drawerTab===k?'active':''}" data-tab="${k}">${l}</button>`).join('')}</div>`;
}
function renderDetailTabContent(type, obj){
  if (drawerTab==='overview') return renderOverviewTab(type, obj);
  if (drawerTab==='notes') return renderActivityTab(type, obj, 'note');
  if (drawerTab==='activity') return renderActivityTab(type, obj, null);
  if (drawerTab==='tasks') return renderTasksTab(type, obj);
  if (drawerTab==='deals') return renderRelatedDealsTab(type, obj);
  return '';
}
function kv(label, value){ return `<div class="k">${label}</div><div class="v">${value}</div>`; }
function renderOverviewTab(type, obj){
  if (type==='contact'){
    const co = companyById(obj.company_id);
    return `<div class="kv">
      ${kv('First name', esc(obj.first_name)||'—')}
      ${kv('Last name', esc(obj.last_name)||'—')}
      ${kv('Email', obj.email?`<a href="mailto:${esc(obj.email)}">${esc(obj.email)}</a>`:'—')}
      ${kv('Phone', esc(obj.phone)||'—')}
      ${kv('Company', co?esc(co.name):'—')}
      ${kv('Lead owner', esc(obj.lead_owner)||'—')}
      ${kv('Pseudo profile', esc(obj.pseudo_profile_name)||'—')}
      ${kv('Location', esc(obj.location)||'—')}
      ${kv('Connected', esc(obj.connected_info)||'—')}
      ${kv('Recruiter LinkedIn', obj.recruiter_linkedin?`<a href="${esc(safeHref(obj.recruiter_linkedin))}" target="_blank" rel="noopener">${esc(obj.recruiter_linkedin)}</a>`:'—')}
      ${kv('Company LinkedIn', obj.company_linkedin?`<a href="${esc(safeHref(obj.company_linkedin))}" target="_blank" rel="noopener">${esc(obj.company_linkedin)}</a>`:'—')}
      ${kv('Added', fmtDate(obj.created_at))}
    </div>`;
  }
  if (type==='company'){
    return `<div class="kv">
      ${kv('Name', esc(obj.name))}
      ${kv('LinkedIn', obj.linkedin?`<a href="${esc(safeHref(obj.linkedin))}" target="_blank" rel="noopener">${esc(obj.linkedin)}</a>`:'—')}
      ${kv('Website', obj.website?`<a href="${esc(safeHref(obj.website))}" target="_blank" rel="noopener">${esc(obj.website)}</a>`:'—')}
      ${kv('Location', esc(obj.location)||'—')}
      ${kv('Notes', esc(obj.notes)||'—')}
      ${kv('Added', fmtDate(obj.created_at))}
    </div>`;
  }
  if (type==='deal'){
    const co = companyById(obj.company_id); const c = contactById(obj.contact_id);
    return `
    <div style="margin-bottom:16px;">
      <label style="font-size:11.5px; font-weight:600; color:var(--fg-muted); display:block; margin-bottom:6px;">Stage</label>
      <select id="stageSelect" style="width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2);">
        ${STAGES.map(s=>`<option value="${s.id}" ${s.id===obj.stage?'selected':''}>${s.label}</option>`).join('')}
      </select>
    </div>
    <div class="kv">
      ${kv('Company', co?esc(co.name):'—')}
      ${kv('Contact', c?esc(contactName(c)):'—')}
      ${kv('Date', fmtDate(obj.date))}
      ${kv('Rate', obj.rate?('$'+esc(obj.rate)+' '+(esc(obj.rate_type)||'')):'—')}
      ${kv('Source', esc(obj.source)||'—')}
      ${kv('Job type', esc(obj.job_type)||'—')}
      ${kv('HR call by', esc(obj.hr_call_by)||'—')}
      ${kv('Interview by', esc(obj.interview_by)||'—')}
      ${kv('Drop reason', esc(obj.position_drop_reason)||'—')}
      ${kv('Notes', esc(obj.notes)||'—')}
      ${kv('Created', fmtDate(obj.created_at))}
      ${kv('Updated', fmtDate(obj.updated_at))}
    </div>`;
  }
  return '';
}
function renderActivityTab(type, obj, kindFilter){
  const items = state.activities
    .filter(a=>a.parent_type===type && a.parent_id===obj.id && (!kindFilter || a.kind===kindFilter))
    .sort((a,b)=> new Date(b.at)-new Date(a.at));
  return `
  <div class="section-title">${kindFilter==='note'?'Add a note':'Log activity'}</div>
  <textarea class="note-input" id="activityInput" placeholder="${kindFilter==='note'?'Write a note…':'What happened? (call, email, update…)'}"></textarea>
  <div class="inline-form">
    ${!kindFilter?`<select id="activityKind">
      <option value="general">General</option><option value="call">Call</option><option value="email">Email</option><option value="conversation">Conversation</option>
    </select>`:''}
    <button class="btn btn-primary btn-sm" id="addActivityBtn">Add</button>
  </div>
  <div class="section-title">History</div>
  ${items.length===0?`<div class="empty-state" style="padding:24px 0;">Nothing logged yet.</div>`:
    items.map(a=>`<div class="act-item"><div class="dot"></div><div class="body"><div class="txt">${esc(a.text)}</div><div class="meta">${esc(a.by)} · ${fmtDateTime(a.at)}${a.kind&&a.kind!=='general'&&a.kind!=='note'?' · '+esc(a.kind):''}</div></div></div>`).join('')}
  `;
}
function renderTasksTab(type, obj){
  const items = state.tasks.filter(t=>t.parent_type===type && t.parent_id===obj.id)
    .sort((a,b)=> (a.done-b.done) || new Date(a.due_date||0)-new Date(b.due_date||0));
  return `
  <div class="section-title">New task</div>
  <div class="inline-form">
    <input id="taskTitle" placeholder="Task title…">
    <input id="taskDue" type="date">
    <button class="btn btn-primary btn-sm" id="addTaskBtn">Add</button>
  </div>
  <div class="section-title">Tasks</div>
  ${items.length===0?`<div class="empty-state" style="padding:24px 0;">No tasks yet.</div>`:
    items.map(t=>`<div class="task-item ${t.done?'done':''}">
      <input type="checkbox" data-task="${t.id}" ${t.done?'checked':''}>
      <div><div class="tt">${esc(t.title)}</div><div class="tm">${t.due_date?('Due '+fmtDate(t.due_date)):'No due date'} · ${esc(t.assigned_to)}</div></div>
    </div>`).join('')}
  `;
}
function renderRelatedDealsTab(type, obj){
  const deals = state.deals.filter(d=> type==='contact' ? d.contact_id===obj.id : d.company_id===obj.id);
  return deals.length===0 ? `<div class="empty-state" style="padding:24px 0;">No deals linked yet.</div>` :
    `<div style="display:flex; flex-direction:column; gap:9px;">${deals.map(d=>`
      <div class="deal-card" data-deal-link="${d.id}"><div class="dn">${esc(d.deal_name)}</div><div class="dc">${stageMeta(d.stage).label}</div></div>`).join('')}</div>`;
}
function bindDetailDrawer(){
  const ov = document.getElementById('drawerOverlay');
  ov.addEventListener('click', (e)=>{ if (e.target===ov) closeDrawer(); });
  const cb = document.getElementById('closeDrawer'); if (cb) cb.addEventListener('click', closeDrawer);
  const eb = document.getElementById('editDetailBtn');
  if (eb) eb.addEventListener('click', ()=>{
    const {type,id} = state.detail;
    if (type==='contact') openContactModal(contactById(id));
    if (type==='company') openCompanyModal(companyById(id));
    if (type==='deal') openDealModal(dealById(id));
  });
  document.querySelectorAll('.tab[data-tab]').forEach(t=> t.addEventListener('click', ()=>{ drawerTab = t.dataset.tab; rerenderDrawer(); }));
  document.querySelectorAll('[data-deal-link]').forEach(el=> el.addEventListener('click', ()=> navigate(state.route, {type:'deal', id:el.dataset.dealLink})));
  const stageSel = document.getElementById('stageSelect');
  if (stageSel) stageSel.addEventListener('change', async ()=>{
    const deal = dealById(state.detail.id);
    const newStage = stageSel.value;
    let reason;
    if (newStage === 'lost' && !deal.position_drop_reason){
      reason = window.prompt('Reason this deal is being marked Lost (optional):', '') || '';
    }
    await setDealStage(deal, newStage, reason);
    toast('Stage updated');
  });
  const addAct = document.getElementById('addActivityBtn');
  if (addAct) addAct.addEventListener('click', async ()=>{
    const txt = document.getElementById('activityInput').value;
    const kindSel = document.getElementById('activityKind');
    const kind = drawerTab==='notes' ? 'note' : (kindSel?kindSel.value:'general');
    if (!txt.trim()) return;
    const ok = await addActivity(state.detail.type, state.detail.id, kind, txt);
    if (ok){ toast('Added'); rerenderDrawer(); }
  });
  const addTaskBtn = document.getElementById('addTaskBtn');
  if (addTaskBtn) addTaskBtn.addEventListener('click', async ()=>{
    const title = document.getElementById('taskTitle').value;
    const due = document.getElementById('taskDue').value;
    if (!title.trim()) return;
    const ok = await addTask(state.detail.type, state.detail.id, title, due);
    if (ok){ toast('Task added'); rerenderDrawer(); }
  });
  document.querySelectorAll('[data-task]').forEach(cb=> cb.addEventListener('change', async ()=>{ await toggleTask(state.tasks.find(t=>t.id===cb.dataset.task)); }));
}
function closeDrawer(){ state.detail = null; drawerTab='overview'; render(); }
function rerenderDrawer(){
  const existing = document.getElementById('drawerOverlay');
  const wrapper = document.createElement('div');
  wrapper.innerHTML = renderDetailDrawer();
  if (existing) existing.replaceWith(wrapper.firstElementChild);
  bindDetailDrawer();
}

/* ---------------- MODALS ---------------- */
function openModal(html, onBind){
  const wrap = document.createElement('div');
  wrap.className = 'modal-overlay'; wrap.id = 'modalOverlay';
  wrap.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click', e=>{ if (e.target===wrap) closeModal(); });
  onBind(wrap);
}
function closeModal(){ const m = document.getElementById('modalOverlay'); if (m) m.remove(); }

  const isEdit = !!existing;

        source: wrap.querySelector('#f_source').value, job_type: wrap.querySelector('#f_jobtype').value,
        hr_call_by: wrap.querySelector('#f_hrcall').value.trim(), interview_by: wrap.querySelector('#f_interviewby').value.trim(),
        position_drop_reason: wrap.querySelector('#f_dropreason').value.trim(), notes: wrap.querySelector('#f_notes').value.trim(),
      };
      if (data.rate !== null && data.rate < 0) return toast('Rate cannot be negative', true);
      try{
        const id = await saveDeal(data, existing?.id);
        closeModal(); toast(isEdit?'Deal updated':'Deal created');
        navigate(state.route, {type:'deal', id});
      }catch(e){ toast(e.message, true); }
    });
  });
}

function openUserModal(existing){
  const isEdit = !!existing;
  const html = `
    <h3>${isEdit?'Edit user':'New user'}</h3>
    <div class="form-grid">
      <div><label>Display name *</label><input id="f_dn" value="${esc(existing?.display_name)}"></div>
      <div><label>Username *</label><input id="f_un" value="${esc(existing?.username)}" ${isEdit?'disabled':''}></div>
      ${!isEdit?`<div class="full"><label>Email *</label><input id="f_email" placeholder="e.g. ali@fourlytic.com"></div>`:''}
      <div><label>${isEdit?'New password (leave blank to keep)':'Password *'}</label><input id="f_pw" type="password" autocomplete="new-password"></div>
      <div><label>Role</label><select id="f_role"><option value="sales" ${existing?.role==='sales'?'selected':''}>Sales Executive</option><option value="admin" ${existing?.role==='admin'?'selected':''}>Admin</option></select></div>
      ${isEdit?`<div class="full"><label><input type="checkbox" id="f_active" ${existing.active!==false?'checked':''} style="width:auto; margin-right:7px;">Active</label></div>`:''}
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" id="cancelBtn">Cancel</button><button class="btn btn-primary" id="saveBtn">${isEdit?'Save changes':'Create user'}</button></div>`;
  openModal(html, (wrap)=>{
    wrap.querySelector('#cancelBtn').addEventListener('click', closeModal);
    wrap.querySelector('#saveBtn').addEventListener('click', async ()=>{
      const dn = wrap.querySelector('#f_dn').value.trim();
      const un = wrap.querySelector('#f_un').value.trim();
      const pw = wrap.querySelector('#f_pw').value;
      const role = wrap.querySelector('#f_role').value;
      if (!dn || !un) return toast('Name and username are required', true);
      if (!isEdit && !pw) return toast('Password is required', true);
      const btn = wrap.querySelector('#saveBtn'); btn.disabled = true; btn.textContent = 'Saving…';
      try{
        if (isEdit){
          const active = wrap.querySelector('#f_active').checked;
          await callManageUser({ action:'update', targetId: existing.id, displayName: dn, role, active, password: pw || undefined });
          toast('User updated');
        } else {
          const emailInput = wrap.querySelector('#f_email').value.trim();
          const email = emailInput || (un.toLowerCase().replace(/[^a-z0-9]/g,'') + '@fourlytic.app');
          await callManageUser({ action:'create', username: un, email, displayName: dn, role, password: pw });
          toast('User created');
        }
        closeModal();
        const m = document.getElementById('main'); if (m){ m.innerHTML = renderAdminPage(); bindAdminPage(); }
      }catch(e){ toast(e.message, true); btn.disabled=false; btn.textContent = isEdit?'Save changes':'Create user'; }
    });
  });
}
</script>
</body>
</html>
